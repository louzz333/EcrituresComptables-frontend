<div class="titre-section">Historique des suppressions</div>
<button class="btn-historique" routerLink="/">
  ← Retour aux écritures
</button>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>N° Écriture</th>
        <th>Libellé</th>
        <th>Date de suppression</th>
        <th>Motif</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let h of historique">
        <td>{{ h.numeroEcriture }}</td>
        <td>{{ h.libelle }}</td>
        <td>{{ h.dateSuppression }}</td>
        <td>{{ h.motif }}</td>
      </tr>
      <tr *ngIf="historique.length === 0">
        <td colspan="4" class="empty-message">Aucune suppression enregistrée</td>
      </tr>
    </tbody>
  </table>
</div>
